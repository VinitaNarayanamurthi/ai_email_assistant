[project]
name = "ai-email-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "pydantic>=2.0",
    "litellm>=1.0",
    "pyyaml>=6.0",
    "openai>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
include = ["src"]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
]
